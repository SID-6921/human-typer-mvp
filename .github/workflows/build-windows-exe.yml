name: build-windows-exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build single-file exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name human-typer `
            --collect-data human_typer `
            --add-data "src/human_typer/profiles;human_typer/profiles" `
            src/human_typer/gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-typer-windows
          path: dist/human-typer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/human-typer.exe
